[project]
name = "axonhub-client"
version = "0.1.0"
description = "AxonHub 管理操作客户端与 CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
axonhubclient = "axonhub_client.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["axonhub_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
